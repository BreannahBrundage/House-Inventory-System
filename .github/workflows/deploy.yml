name: Deploy SimpleSite to AWS EC2

on:
  push:
    branches: [release]
  

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check SSH secret size
        env:
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          echo "SSH key bytes: $(printf '%s" "$SSH_KEY" | wc -c)"
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd /home/ec2-user/House-Inventory-System
            git fetch origin release
            git checkout release
            git pull --ff-only origin release
            cd code/HouseInventory_Project/SimpleSite
            npm ci
            pm2 restart simplesite
            pm2 save
